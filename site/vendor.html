<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gharnish — Vendor Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
  :root{--g:#C8860A;--gl:#E09A18;--ink:#17120b;--ink2:#5b5348;--ink3:#8a7d6c;--line:#e6e1d8;--bg:#F4F3F1;--grn:#1B7A4D;--red:#C62828}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  .topbar{position:sticky;top:0;z-index:10;background:#17120b;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .topbar .logo{height:26px}
  .topbar .vn{font-weight:800;font-size:15px;font-family:Poppins,sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .hd{padding:18px 2px 6px}
  .hd h1{font-family:Poppins,sans-serif;font-size:21px;font-weight:800;margin:0 0 3px}
  .hd p{font-size:13px;color:var(--ink3);margin:0}
  .card{background:#fff;border:1px solid rgba(20,16,10,.06);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(20,16,10,.04)}
  .prow{display:flex;gap:12px;align-items:flex-start}
  .thumb{width:64px;height:64px;flex:none;border-radius:12px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:22px}
  .pnm{font-weight:800;font-size:14.5px;line-height:1.25}
  .pmeta{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .fields{margin-top:12px;display:grid;grid-template-columns:1fr;gap:12px}
  .fl{display:block;font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
  .in{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
  .in:focus{border-color:var(--g)}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .save{margin-top:12px;width:100%;background:#17120b;color:#fff;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit}
  .save:disabled{opacity:.6}
  .login{max-width:380px;margin:8vh auto 0;text-align:center}
  .login .logo{height:38px;margin-bottom:10px}
  .login h1{font-family:Poppins,sans-serif;font-size:22px;margin:0 0 4px}
  .login .sub{font-size:13px;color:var(--ink3);margin:0 0 18px}
  .login .in{margin-bottom:11px;text-align:left}
  .btn{width:100%;background:var(--g);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.6}
  .err{background:#FDECEC;color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:left}
  .loading{padding:60px 0;text-align:center;color:var(--ink3)}
  .empty{padding:40px 16px;text-align:center;color:var(--ink3)}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#E8F5EA;color:var(--grn);margin-top:6px}
  .badge.up{background:#FFF3E0;color:#B26A00}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#17120b;color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--red)}
  .hint{font-size:11px;color:var(--ink3);margin-top:4px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid rgba(20,16,10,.15);background:#fff;color:var(--ink2);font-family:inherit}
  .chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .search{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none;margin:8px 0 2px}
  .search:focus{border-color:var(--g)}
  .chips2{padding-top:4px}
  .chips2 .chip{padding:6px 12px;font-size:11.5px}
  .chips2 .chip.on{border-color:var(--g);background:var(--g);color:#fff}
  .catrow{display:flex;gap:14px;overflow-x:auto;padding:12px 0 6px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .catrow::-webkit-scrollbar{display:none}
  .catc{flex:none;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px}
  .catc .ring{position:relative;width:60px;height:60px;border-radius:50%;padding:2.5px;border:2.5px solid #e6e1d8;box-sizing:border-box;transition:border-color .15s}
  .catc.on .ring{border-color:var(--g)}
  .catc .cimg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:linear-gradient(135deg,#3a2c14,#6b4f22)}
  .catc .cimg.ini{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;font-family:'Poppins',sans-serif}
  .catc .cimg.gridic{display:flex;align-items:center;justify-content:center}
  .catc .cimg.gridic svg{width:26px;height:26px}
  .catc .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-family:'Poppins',sans-serif}
  .catc.on .cnt{background:var(--g)}
  .catc .lbl{font-size:10.5px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.15;max-width:66px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .catc.on .lbl{color:var(--ink);font-weight:700}
  .catsep{flex:none;width:1px;align-self:center;height:44px;background:#e6e1d8;margin:0 2px}
  .catc.clr .ring{border-color:#eab88f}
  .catc.clr .cimg{background:linear-gradient(135deg,#e8873f,#c85a17)}
  .catc.clr .cnt{background:#c85a17}
  .catc.clr.on .ring{border-color:#c85a17}
  .catc.clr.on .cnt{background:#c85a17}
  .catc.clr.on .lbl{color:#c85a17}
  .subrow{padding:4px 0 4px}
  .subrow .catc{width:58px;gap:5px}
  .subrow .ring{width:50px;height:50px;border-width:2px}
  .subrow .cimg.ini{font-size:17px}
  .subrow .cimg.gridic svg{width:22px;height:22px}
  .subrow .lbl{font-size:10px;max-width:58px}
  .clrbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px 0}
  .clrbar-t{font-family:Poppins,sans-serif;font-size:15px;font-weight:800;color:var(--ink)}
  .clrbtn{border:none;border-radius:999px;padding:9px 15px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
  .clrbtn.add{background:#c85a17;color:#fff}
  .clrbtn.done{background:#17120b;color:#fff}
  .clrhead{font-size:12px;color:var(--ink2);background:#fff7f2;border:1px solid #f3d9c9;border-radius:11px;padding:10px 12px;margin:8px 0 2px;line-height:1.5}
  .clrhead b{color:#b1541f}
  .clrhint{font-size:12px;font-weight:700;color:var(--ink3)}
  .pcard.clron{border-color:#eab88f;background:#fffaf6}
  .pcard.clron .clrhint{color:#c85a17}
  .clrx{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink3);font-size:14px;cursor:pointer;line-height:1}
  .clrx:hover{border-color:#c85a17;color:#c85a17}
  .clradd{flex:none;background:#c85a17;color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
  .clradd:disabled{opacity:.6}
  .clrprice{margin-top:10px;display:flex;align-items:flex-end;gap:12px}
  .clrprice .f{min-width:0;max-width:170px}
  .clrprice label{display:block;font-size:9px;font-weight:800;color:#b1541f;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
  .clrprice .inr{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;background:#fff;padding-left:10px}
  .clrprice .inr:focus-within{border-color:#c85a17}
  .clrprice .inr span{font-weight:800;color:var(--ink2);font-size:15px}
  .clrprice .inr .cin{border:none;background:none;padding-left:4px}
  .clrprice .inr .cin:focus{border:none}
  .clrbase{font-size:11px;color:var(--ink3);padding-bottom:11px;text-decoration:line-through}
  .cat-h{font-family:Poppins,sans-serif;font-size:15px;font-weight:800;color:var(--ink);margin:16px 2px 4px}
  .cat-h span{font-size:12px;font-weight:600;color:var(--ink3)}
  .pcard{background:#fff;border:1px solid rgba(20,16,10,.06);border-radius:14px;padding:11px 12px;margin:9px 0;box-shadow:0 1px 2px rgba(20,16,10,.04)}
  .row1{display:flex;gap:10px;align-items:center}
  .row1 .thumb{width:56px;height:56px;border-radius:12px}
  .nmwrap{flex:1;min-width:0}
  .row1 .pnm{font-weight:400;font-size:12.5px;line-height:1.3;color:var(--ink)}
  .row1 .pmeta{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stockin{flex:none;width:92px}
  .stockin label{display:block;font-size:9px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;text-align:right}
  .cin{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
  .cin:focus{border-color:var(--g)}
  .stockin .cin{text-align:right;padding:9px 8px}
  .upbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .upbox .f{min-width:0}
  .upbox label{display:block;font-size:9px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
  .actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .uptoggle{background:none;border:none;color:var(--ink2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:4px 0;display:inline-flex;align-items:center;gap:5px;text-align:left;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uptoggle.set{color:var(--g)}
  .save2{flex:none;background:#17120b;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .save2:disabled{opacity:.6}
  .row1 .stockin .cin{font-weight:800;font-size:16px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="loading">Loading…</div></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL='https://djedmaezxvuzmwjnooel.supabase.co';
var SUPABASE_KEY='sb_publishable_ZLUr4NQFTEN6qzVAYNL7CA_qocs1pQK';
var LOGO='https://gharnish.app/icons/icon-192.png';
var supa=null; try{ supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}
var V=null, PRODS=[], PV={}, INV={items:{},incoming:{}}, VCAT='all', VSUB='all', VQ='';
var SUBCATS={}, PSUB={}, SUBNAME={}, CLR={}, VCLRADD=false;
var CATLBL={chair:'Chairs',stool:'Stools','restaurant-tables':'Restaurant Tables','table-round':'Round Tables','table-square':'Square Tables','table-rect':'Rectangular Tables','table-base':'Table Bases',booth:'Booths & Sofas','outdoor-chair':'Outdoor Chairs','outdoor-table':'Outdoor Tables','restaurant-set':'Restaurant Sets'};
function catLabel(c){ if(!c||c==='other') return 'Other'; return CATLBL[c]||String(c).replace(/[-_]/g,' ').replace(/\b\w/g,function(ch){return ch.toUpperCase();}); }

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function screen(h){ document.getElementById('app').innerHTML=h; }
function parseVal(v){ if(v==null) return {}; if(typeof v==='string'){ try{ return JSON.parse(v); }catch(e){ return {}; } } return v; }
function parseClearance(v){ v=parseVal(v); var m={}; var it=(v&&v.items)?v.items:null; if(it){ Object.keys(it).forEach(function(id){ var x=it[id]||{}; m[id]={price:(x.offer||0),qty:(x.qty||0)}; }); } return m; }
function onClr(pid){ return !!(CLR && CLR[pid]); }
function clrPrice(pid){ return (CLR && CLR[pid] && CLR[pid].price>0)?CLR[pid].price:''; }
var _tt=null;
function toast(msg,bad){ var t=document.getElementById('toast'); if(!t)return; t.textContent=msg; t.className='on'+(bad?' bad':''); clearTimeout(_tt); _tt=setTimeout(function(){ t.className=''; },2200); }

function renderLogin(err){
  screen('<div class="wrap"><div class="card login">'
    +'<img class="logo" src="'+LOGO+'" alt="Gharnish" onerror="this.style.display=\'none\'">'
    +'<h1>Vendor Portal</h1><p class="sub">Sign in to update stock for the products assigned to you.</p>'
    +(err?'<div class="err">'+esc(err)+'</div>':'')
    +'<input class="in" id="v-email" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">'
    +'<input class="in" id="v-pass" type="password" placeholder="Password" autocomplete="current-password">'
    +'<button class="btn" id="v-login-btn" onclick="doLogin()">Sign in</button>'
    +'</div></div>');
  var pe=document.getElementById('v-pass'); if(pe) pe.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
}
function doLogin(){
  if(!supa){ renderLogin('Connection unavailable'); return; }
  var email=(val('v-email')||'').trim().toLowerCase(); var pass=val('v-pass')||'';
  if(!email||!pass){ renderLogin('Enter your email and password'); return; }
  var b=document.getElementById('v-login-btn'); if(b){ b.disabled=true; b.textContent='Signing in…'; }
  supa.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error){ renderLogin(r.error.message||'Wrong email or password'); return; }
    boot();
  },function(){ renderLogin('Sign in failed — please try again'); });
}
function logout(){ if(supa) supa.auth.signOut().then(function(){ V=null; renderLogin(); },function(){ renderLogin(); }); else renderLogin(); }

function renderNoVendor(){
  screen('<div class="wrap"><div class="card login">'
    +'<h1>Not linked to a vendor</h1>'
    +'<p class="sub">This login isn\u2019t connected to a vendor account yet. Please contact Gharnish to set it up.</p>'
    +'<button class="btn" onclick="logout()">Sign out</button></div></div>');
}

function boot(){
  screen('<div class="wrap"><div class="loading">Loading your products\u2026</div></div>');
  supa.rpc('my_vendor').then(function(r){
    if(r.error || !r.data || !r.data.length){ renderNoVendor(); return; }
    V=r.data[0];
    Promise.all([
      supa.from('gharnish_products').select('id,name,cat,image,price,hidden,internal').then(function(x){ return x.data||[]; }, function(){ return []; }),
      supa.from('app_settings').select('value').eq('key','product_vendors').maybeSingle().then(function(x){ return (x.data&&x.data.value)||{}; }, function(){ return {}; }),
      supa.from('app_settings').select('value').eq('key','inventory').maybeSingle().then(function(x){ return (x.data&&x.data.value)||{}; }, function(){ return {}; }),
      supa.from('app_settings').select('value').eq('key','subcategories').maybeSingle().then(function(x){ return (x.data&&x.data.value)||{}; }, function(){ return {}; }),
      supa.from('app_settings').select('value').eq('key','product_subcats').maybeSingle().then(function(x){ return (x.data&&x.data.value)||{}; }, function(){ return {}; }),
      supa.from('app_settings').select('value').eq('key','clearance').maybeSingle().then(function(x){ return (x.data&&x.data.value)||{}; }, function(){ return {}; })
    ]).then(function(res){
      PRODS=res[0]||[]; PV=parseVal(res[1]); INV=parseVal(res[2])||{};
      SUBCATS=parseVal(res[3])||{}; PSUB=parseVal(res[4])||{};
      CLR=parseClearance(res[5]);
      SUBNAME={}; Object.keys(SUBCATS).forEach(function(pc){ (SUBCATS[pc]||[]).forEach(function(s){ if(s&&s.key) SUBNAME[s.key]=s.name; }); });
      if(!INV.items) INV.items={}; if(!INV.incoming) INV.incoming={};
      renderPortal();
    });
  },function(){ renderNoVendor(); });
}

function isMine(pid){ var v=PV[pid]; if(v==null) return false; if(typeof v==='object'){ for(var k in v){ if(v[k]!=null && String(v[k])===String(V.id)) return true; } return false; } return String(v)===String(V.id); }

function vfilter(c){ VCAT=c; VSUB='all'; VCLRADD=false; renderPortal(); try{ window.scrollTo({top:0}); }catch(e){} }
function vsub(s){ VSUB=s; renderPortal(); try{ window.scrollTo({top:0}); }catch(e){} }
function vsearch(q){ VQ=q||''; renderList(); }
function subKeysOf(pid){ var a=PSUB[pid]; return (a&&a.length)?a:[]; }
function subNamesOf(pid){ return subKeysOf(pid).map(function(k){ return SUBNAME[k]||''; }).filter(Boolean); }
function fmtDate(d){ if(!d) return ''; try{ var dt=new Date(d+'T00:00:00'); if(isNaN(dt.getTime())) return d; return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return d; } }
function toggleUp(pid){ var el=document.getElementById('up-'+pid); if(!el) return; var show=(el.style.display==='none'||!el.style.display); el.style.display=show?'grid':'none'; if(show){ var f=document.getElementById('iq-'+pid); if(f) f.focus(); } }
function stockCard(p){
  var q=(INV.items && typeof INV.items[p.id]==='number')?INV.items[p.id]:'';
  var inc=(INV.incoming && INV.incoming[p.id])||null;
  var iq=(inc && inc.qty)?inc.qty:''; var idt=(inc && inc.date)?inc.date:'';
  var img=p.image?('<img class="thumb" src="'+esc(p.image)+'" loading="lazy">'):'<div class="thumb ph">🪑</div>';
  var pid=esc(p.id); var pidJs=jsEsc(String(p.id));
  var hasUp=(iq!==''||!!idt);
  var upLabel=hasUp ? ('🚚 '+(iq!==''?iq+' Pc':'Upcoming')+(idt?(' · '+esc(fmtDate(idt))):'')+' · edit') : '🚚 Add upcoming stock';
  var subs=subNamesOf(p.id); var meta=subs.length?subs.join(', '):(p.cat?catLabel(p.cat):'');
  return '<div class="pcard"><div class="row1">'+img
    +'<div class="nmwrap"><div class="pnm">'+esc(p.name||'')+'</div>'+(meta?('<div class="pmeta">'+esc(meta)+'</div>'):'')+'</div>'
    +'<div class="stockin"><label>In stock</label><input class="cin" type="number" inputmode="numeric" min="0" id="q-'+pid+'" value="'+q+'" placeholder="—"></div></div>'
    +'<div class="upbox" id="up-'+pid+'" style="display:'+(hasUp?'grid':'none')+'"><div class="f"><label>Upcoming (Pc)</label><input class="cin" type="number" inputmode="numeric" min="0" id="iq-'+pid+'" value="'+iq+'" placeholder="e.g. 50"></div>'
    +'<div class="f"><label>Arriving on</label><input class="cin" type="date" id="id-'+pid+'" value="'+esc(idt)+'"></div></div>'
    +'<div class="actions"><button class="uptoggle'+(hasUp?' set':'')+'" onclick="toggleUp(\''+pidJs+'\')">'+upLabel+'</button>'
    +'<button class="save2" id="save-'+pid+'" onclick="saveProd(\''+pidJs+'\')">Save</button></div></div>';
}
function pcardHead(p){
  var subs=subNamesOf(p.id); var meta=subs.length?subs.join(', '):(p.cat?catLabel(p.cat):'');
  var img=p.image?('<img class="thumb" src="'+esc(p.image)+'" loading="lazy">'):'<div class="thumb ph">🪑</div>';
  return img+'<div class="nmwrap"><div class="pnm">'+esc(p.name||'')+'</div>'+(meta?('<div class="pmeta">'+esc(meta)+'</div>'):'')+'</div>';
}
function fmtINR(n){ try{ return '₹'+Number(n).toLocaleString('en-IN'); }catch(e){ return '₹'+n; } }
function clrCard(p){
  var pr=clrPrice(p.id);
  var pid=esc(p.id); var pidJs=jsEsc(String(p.id));
  var base=(typeof p.price==='number'&&p.price>0)?p.price:0;
  return '<div class="pcard clron" id="pc-'+pid+'"><div class="row1">'+pcardHead(p)
    +'<button class="clrx" id="rm-'+pid+'" onclick="removeClr(\''+pidJs+'\')" title="Remove from clearance" aria-label="Remove">✕</button></div>'
    +'<div class="clrprice"><div class="f"><label>Special price</label><div class="inr"><span>₹</span><input class="cin" type="number" inputmode="numeric" min="0" id="cp-'+pid+'" value="'+pr+'" placeholder="'+(base?base:'e.g. 1499')+'"></div></div>'
    +(base?'<div class="clrbase">Usual '+fmtINR(base)+'</div>':'')+'</div>'
    +'<div class="actions"><span class="clrhint">🏷️ In the Offers tab</span>'
    +'<button class="save2" id="save-'+pid+'" onclick="saveClrPrice(\''+pidJs+'\')">Save price</button></div></div>';
}
function addPickCard(p){
  var pid=esc(p.id); var pidJs=jsEsc(String(p.id));
  return '<div class="pcard" id="pc-'+pid+'"><div class="row1">'+pcardHead(p)
    +'<button class="clradd" id="add-'+pid+'" onclick="addClr(\''+pidJs+'\')">＋ Add</button></div></div>';
}
function myProducts(){ return (PRODS||[]).filter(function(p){ return isMine(p.id) && !p.internal; }); }
function renderList(){
  var el=document.getElementById('vlist'); if(!el) return;
  var q=(VQ||'').trim().toLowerCase();
  var isClr=(VCAT==='__clr__');
  var scope=myProducts();
  if(isClr){ scope=scope.filter(function(p){ return VCLRADD ? !onClr(p.id) : onClr(p.id); }); }
  if(!isClr && VCAT!=='all') scope=scope.filter(function(p){ return (p.cat||'other')===VCAT; });
  if(!isClr && VCAT!=='all' && VSUB!=='all'){
    if(VSUB==='__none__') scope=scope.filter(function(p){ return subKeysOf(p.id).length===0; });
    else scope=scope.filter(function(p){ return subKeysOf(p.id).indexOf(VSUB)>-1; });
  }
  if(q) scope=scope.filter(function(p){ return (p.name||'').toLowerCase().indexOf(q)>-1 || String(p.id||'').toLowerCase().indexOf(q)>-1; });
  var card=isClr?(VCLRADD?addPickCard:clrCard):stockCard;
  scope.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  if(!scope.length){
    if(isClr && !VCLRADD && !q){ el.innerHTML='<div class="empty">No products on clearance yet.<br>Tap <b>＋ Add products</b> to put items on sale.</div>'; return; }
    if(isClr && VCLRADD && !q){ el.innerHTML='<div class="empty">All your products are already on clearance.</div>'; return; }
    el.innerHTML='<div class="empty">No products match'+(q?' “'+esc(VQ)+'”':'')+'.</div>'; return;
  }
  var H='';
  if((VCAT==='all'||(isClr&&VCLRADD)) && !q){
    var byCat={}; scope.forEach(function(p){ var c=p.cat||'other'; (byCat[c]=byCat[c]||[]).push(p); });
    Object.keys(byCat).sort(function(a,b){ return catLabel(a).localeCompare(catLabel(b)); }).forEach(function(c){
      H+='<div class="cat-h">'+esc(catLabel(c))+' <span>('+byCat[c].length+')</span></div>';
      byCat[c].forEach(function(p){ H+=card(p); });
    });
  } else {
    scope.forEach(function(p){ H+=card(p); });
  }
  H+='<div style="height:72px"></div>';
  el.innerHTML=H;
}
function jsEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function catImg(c){
  var m=myProducts();
  for(var i=0;i<m.length;i++){ if((m[i].cat||'other')===c && m[i].image) return m[i].image; }
  return '';
}
function subImg(subKey){
  var m=myProducts();
  for(var i=0;i<m.length;i++){ var p=m[i]; if((p.cat||'other')===VCAT && p.image && subKeysOf(p.id).indexOf(subKey)>-1) return p.image; }
  return '';
}
var GRID_SVG='<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.6" fill="#fff"/><rect x="14" y="3" width="7" height="7" rx="1.6" fill="#fff"/><rect x="3" y="14" width="7" height="7" rx="1.6" fill="#fff"/><rect x="14" y="14" width="7" height="7" rx="1.6" fill="#fff"/></svg>';
var LAYERS_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 4.9-9 4.9-9-4.9 9-4.9Z" fill="#fff"/><path d="M3.2 12.5 12 17.3l8.8-4.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var TAG_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M4 4h7.2c.5 0 1 .2 1.35.56l7.9 7.9a1.9 1.9 0 0 1 0 2.7l-5.94 5.94a1.9 1.9 0 0 1-2.7 0l-7.9-7.9A1.9 1.9 0 0 1 4 12.4V4Z" fill="#fff"/><circle cx="8.4" cy="8.4" r="1.7" fill="#c85a17"/></svg>';
var DASH_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
function circle(o){
  var inner;
  if(o.icon){ inner='<span class="cimg gridic">'+o.icon+'</span>'; }
  else if(o.img){ inner='<img class="cimg" src="'+esc(o.img)+'" loading="lazy" alt="" onerror="this.outerHTML=\'<span class=&quot;cimg ini&quot;>'+esc((o.label||'?').charAt(0).toUpperCase())+'</span>\'">'; }
  else { inner='<span class="cimg ini">'+esc((o.label||'?').charAt(0).toUpperCase())+'</span>'; }
  return '<button class="catc'+(o.cls?' '+o.cls:'')+(o.on?' on':'')+'" onclick="'+o.onclick+'" title="'+esc(o.label)+'">'+
    '<span class="ring">'+inner+(o.count!=null?'<span class="cnt">'+o.count+'</span>':'')+'</span>'+
    '<span class="lbl">'+esc(o.label)+'</span></button>';
}
function renderPortal(){
  var mine=myProducts();
  var catCounts={}; mine.forEach(function(p){ var c=p.cat||'other'; catCounts[c]=(catCounts[c]||0)+1; });
  var catKeys=Object.keys(catCounts).sort(function(a,b){ return catLabel(a).localeCompare(catLabel(b)); });
  if(VCAT!=='all' && VCAT!=='__clr__' && !catCounts[VCAT]){ VCAT='all'; VSUB='all'; }
  var H='<div class="topbar"><img class="logo" src="'+LOGO+'" alt="Gharnish" onerror="this.style.display=\'none\'"><div class="vn">'+esc(V.name||'Vendor')+'</div><button onclick="logout()">Sign out</button></div>';
  H+='<div class="wrap"><div class="hd"><h1>Your stock</h1><p>Set what you have ready and any upcoming stock. Updates show to customers instantly.</p></div>';
  if(!mine.length){ H+='<div class="empty">No products are assigned to you yet.<br>Please contact Gharnish.</div></div>'; screen(H); return; }
  H+='<input class="search" id="vq" type="search" enterkeyhint="search" placeholder="Search your products…" value="'+esc(VQ)+'" oninput="vsearch(this.value)">';
  var clrCount=mine.filter(function(p){ return onClr(p.id); }).length;
  H+='<div class="catrow">'+circle({onclick:"vfilter('all')",on:VCAT==='all',count:mine.length,label:'All',icon:GRID_SVG});
  catKeys.forEach(function(c){ H+=circle({onclick:"vfilter('"+jsEsc(c)+"')",on:VCAT===c,count:catCounts[c],label:catLabel(c),img:catImg(c)}); });
  H+='<span class="catsep"></span>'+circle({onclick:"vfilter('__clr__')",on:VCAT==='__clr__',count:clrCount||null,label:'Clearance',icon:TAG_SVG,cls:'clr'});
  H+='</div>';
  if(VCAT==='__clr__'){
    H+='<div class="clrbar"><div class="clrbar-t">'+(VCLRADD?'Add products to clearance':'Clearance sale ('+clrCount+')')+'</div>'
      +(VCLRADD
         ? '<button class="clrbtn done" onclick="clrAddMode(false)">Done</button>'
         : '<button class="clrbtn add" onclick="clrAddMode(true)">＋ Add products</button>')+'</div>';
    H+='<div class="clrhead">'+(VCLRADD
        ? 'Tap <b>Add</b> to put a product on clearance, then set the special price.'
        : 'These products show in the app’s <b>Offers</b> tab at your special price.')+'</div>';
  } else if(VCAT!=='all'){
    var inCat=mine.filter(function(p){ return (p.cat||'other')===VCAT; });
    var subCount={}, noneCount=0;
    inCat.forEach(function(p){ var ks=subKeysOf(p.id); if(!ks.length) noneCount++; ks.forEach(function(k){ subCount[k]=(subCount[k]||0)+1; }); });
    var catSubs=(SUBCATS[VCAT]||[]).filter(function(s){ return s&&subCount[s.key]; });
    if(catSubs.length){
      if(VSUB!=='all' && VSUB!=='__none__' && !subCount[VSUB]) VSUB='all';
      H+='<div class="catrow subrow">'+circle({onclick:"vsub('all')",on:VSUB==='all',label:'All',icon:LAYERS_SVG});
      catSubs.forEach(function(s){ H+=circle({onclick:"vsub('"+jsEsc(s.key)+"')",on:VSUB===s.key,count:subCount[s.key],label:s.name,img:subImg(s.key)}); });
      if(noneCount) H+=circle({onclick:"vsub('__none__')",on:VSUB==='__none__',count:noneCount,label:'Other',icon:DASH_SVG});
      H+='</div>';
    } else { VSUB='all'; }
  }
  H+='<div id="vlist"></div></div>';
  screen(H);
  renderList();
  try{ var onc=document.querySelector('.catrow .catc.on'); if(onc&&onc.scrollIntoView) onc.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){}
}

function saveProd(pid){
  var qtyRaw=val('q-'+pid); var iqtyRaw=val('iq-'+pid); var idate=(val('id-'+pid)||'').trim();
  var qty=(qtyRaw===''?null:Math.max(0,parseInt(qtyRaw,10)||0));
  var iqty=(iqtyRaw===''?null:Math.max(0,parseInt(iqtyRaw,10)||0));
  var d=idate||null;
  var b=document.getElementById('save-'+pid); if(b){ b.disabled=true; b.textContent='Saving\u2026'; }
  supa.rpc('vendor_update_stock',{p_product_id:pid,p_qty:qty,p_incoming_qty:iqty,p_incoming_date:d}).then(function(r){
    if(b){ b.disabled=false; b.textContent='Save'; }
    if(r.error){ toast('Failed: '+(r.error.message||'error'),true); return; }
    if(qty===null) delete INV.items[pid]; else INV.items[pid]=qty;
    if((iqty===null||iqty<=0)&&!d) delete INV.incoming[pid]; else INV.incoming[pid]={qty:iqty||0,date:d||''};
    toast('Saved \u2713');
  },function(){ if(b){ b.disabled=false; b.textContent='Save'; } toast('Save failed',true); });
}
function clrAddMode(on){ VCLRADD=!!on; renderPortal(); try{ window.scrollTo({top:0}); }catch(e){} }
function addClr(pid){
  var b=document.getElementById('add-'+pid); if(b){ b.disabled=true; b.textContent='Adding\u2026'; }
  supa.rpc('vendor_set_clearance',{p_product_id:pid,p_active:true,p_price:0,p_qty:null}).then(function(r){
    if(r.error){ if(b){ b.disabled=false; b.textContent='\uff0b Add'; } toast('Failed: '+(r.error.message||'error'),true); return; }
    CLR[pid]={price:0,qty:(CLR[pid]&&CLR[pid].qty)||0};
    var card=document.getElementById('pc-'+esc(pid)); if(card){ card.style.transition='opacity .15s'; card.style.opacity='0'; setTimeout(renderList,150); } else renderList();
    toast('Added to clearance \u2713');
  },function(){ if(b){ b.disabled=false; b.textContent='\uff0b Add'; } toast('Add failed',true); });
}
function removeClr(pid){
  var b=document.getElementById('rm-'+pid); if(b) b.disabled=true;
  supa.rpc('vendor_set_clearance',{p_product_id:pid,p_active:false,p_price:null,p_qty:null}).then(function(r){
    if(r.error){ if(b) b.disabled=false; toast('Failed: '+(r.error.message||'error'),true); return; }
    delete CLR[pid];
    var card=document.getElementById('pc-'+esc(pid)); if(card){ card.style.transition='opacity .15s'; card.style.opacity='0'; setTimeout(function(){ renderPortal(); },150); } else renderPortal();
    toast('Removed from clearance');
  },function(){ if(b) b.disabled=false; toast('Remove failed',true); });
}
function saveClrPrice(pid){
  var prRaw=val('cp-'+pid);
  var pr=(prRaw===''?0:Math.max(0,parseInt(prRaw,10)||0));
  var b=document.getElementById('save-'+pid); if(b){ b.disabled=true; b.textContent='Saving\u2026'; }
  supa.rpc('vendor_set_clearance',{p_product_id:pid,p_active:true,p_price:pr,p_qty:null}).then(function(r){
    if(b){ b.disabled=false; b.textContent='Save price'; }
    if(r.error){ toast('Failed: '+(r.error.message||'error'),true); return; }
    if(!CLR[pid]) CLR[pid]={qty:0}; CLR[pid].price=pr;
    toast(pr>0?'Special price saved \u2713':'Saved');
  },function(){ if(b){ b.disabled=false; b.textContent='Save price'; } toast('Save failed',true); });
}

/* init: resume session or show login */
(function(){
  if(!supa){ renderLogin('Connection unavailable'); return; }
  supa.auth.getSession().then(function(r){
    if(r && r.data && r.data.session){ boot(); } else { renderLogin(); }
  },function(){ renderLogin(); });
})();
</script>
</body>
