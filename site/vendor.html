<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gharnish — Vendor Portal</title>
<style>
  :root{--g:#C8860A;--gl:#E09A18;--ink:#17120b;--ink2:#5b5348;--ink3:#8a7d6c;--line:#e6e1d8;--bg:#F4F3F1;--grn:#1B7A4D;--red:#C62828}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  .topbar{position:sticky;top:0;z-index:10;background:#17120b;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .topbar .logo{height:26px}
  .topbar .vn{font-weight:800;font-size:15px;font-family:Poppins,sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .hd{padding:18px 2px 6px}
  .hd h1{font-family:Poppins,sans-serif;font-size:21px;font-weight:800;margin:0 0 3px}
  .hd p{font-size:13px;color:var(--ink3);margin:0}
  .card{background:#fff;border:1px solid rgba(20,16,10,.06);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(20,16,10,.04)}
  .prow{display:flex;gap:12px;align-items:flex-start}
  .thumb{width:64px;height:64px;flex:none;border-radius:12px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:22px}
  .pnm{font-weight:800;font-size:14.5px;line-height:1.25}
  .pmeta{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .fields{margin-top:12px;display:grid;grid-template-columns:1fr;gap:12px}
  .fl{display:block;font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
  .in{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
  .in:focus{border-color:var(--g)}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .save{margin-top:12px;width:100%;background:#17120b;color:#fff;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit}
  .save:disabled{opacity:.6}
  .login{max-width:380px;margin:8vh auto 0;text-align:center}
  .login .logo{height:38px;margin-bottom:10px}
  .login h1{font-family:Poppins,sans-serif;font-size:22px;margin:0 0 4px}
  .login .sub{font-size:13px;color:var(--ink3);margin:0 0 18px}
  .login .in{margin-bottom:11px;text-align:left}
  .btn{width:100%;background:var(--g);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.6}
  .err{background:#FDECEC;color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:left}
  .loading{padding:60px 0;text-align:center;color:var(--ink3)}
  .empty{padding:40px 16px;text-align:center;color:var(--ink3)}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#E8F5EA;color:var(--grn);margin-top:6px}
  .badge.up{background:#FFF3E0;color:#B26A00}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#17120b;color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--red)}
  .hint{font-size:11px;color:var(--ink3);margin-top:4px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="loading">Loading…</div></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL='https://djedmaezxvuzmwjnooel.supabase.co';
var SUPABASE_KEY='sb_publishable_ZLUr4NQFTEN6qzVAYNL7CA_qocs1pQK';
var LOGO='https://gharnish.app/icons/icon-192.png';
var supa=null; try{ supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}
var V=null, PRODS=[], PV={}, INV={items:{},incoming:{}};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function screen(h){ document.getElementById('app').innerHTML=h; }
function parseVal(v){ if(v==null) return {}; if(typeof v==='string'){ try{ return JSON.parse(v); }catch(e){ return {}; } } return v; }
var _tt=null;
function toast(msg,bad){ var t=document.getElementById('toast'); if(!t)return; t.textContent=msg; t.className='on'+(bad?' bad':''); clearTimeout(_tt); _tt=setTimeout(function(){ t.className=''; },2200); }

function renderLogin(err){
  screen('<div class="wrap"><div class="card login">'
    +'<img class="logo" src="'+LOGO+'" alt="Gharnish" onerror="this.style.display=\'none\'">'
    +'<h1>Vendor Portal</h1><p class="sub">Sign in to update stock for the products assigned to you.</p>'
    +(err?'<div class="err">'+esc(err)+'</div>':'')
    +'<input class="in" id="v-email" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">'
    +'<input class="in" id="v-pass" type="password" placeholder="Password" autocomplete="current-password">'
    +'<button class="btn" id="v-login-btn" onclick="doLogin()">Sign in</button>'
    +'</div></div>');
  var pe=document.getElementById('v-pass'); if(pe) pe.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
}
function doLogin(){
  if(!supa){ renderLogin('Connection unavailable'); return; }
  var email=(val('v-email')||'').trim().toLowerCase(); var pass=val('v-pass')||'';
  if(!email||!pass){ renderLogin('Enter your email and password'); return; }
  var b=document.getElementById('v-login-btn'); if(b){ b.disabled=true; b.textContent='Signing in…'; }
  supa.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error){ renderLogin(r.error.message||'Wrong email or password'); return; }
    boot();
  },function(){ renderLogin('Sign in failed — please try again'); });
}
function logout(){ if(supa) supa.auth.signOut().then(function(){ V=null; renderLogin(); },function(){ renderLogin(); }); else renderLogin(); }

function renderNoVendor(){
  screen('<div class="wrap"><div class="card login">'
    +'<h1>Not linked to a vendor</h1>'
    +'<p class="sub">This login isn\u2019t connected to a vendor account yet. Please contact Gharnish to set it up.</p>'
    +'<button class="btn" onclick="logout()">Sign out</button></div></div>');
}

function boot(){
  screen('<div class="wrap"><div class="loading">Loading your products\u2026</div></div>');
  supa.rpc('my_vendor').then(function(r){
    if(r.error || !r.data || !r.data.length){ renderNoVendor(); return; }
    V=r.data[0];
    Promise.all([
      supa.from('gharnish_products').select('id,name,cat,image,price,hidden,internal').then(function(x){ return x.data||[]; }, function(){ return []; }),
      supa.from('app_settings').select('value').eq('key','product_vendors').maybeSingle().then(function(x){ return (x.data&&x.data.value)||{}; }, function(){ return {}; }),
      supa.from('app_settings').select('value').eq('key','inventory').maybeSingle().then(function(x){ return (x.data&&x.data.value)||{}; }, function(){ return {}; })
    ]).then(function(res){
      PRODS=res[0]||[]; PV=parseVal(res[1]); INV=parseVal(res[2])||{};
      if(!INV.items) INV.items={}; if(!INV.incoming) INV.incoming={};
      renderPortal();
    });
  },function(){ renderNoVendor(); });
}

function isMine(pid){ var v=PV[pid]; if(v==null) return false; if(typeof v==='object'){ for(var k in v){ if(v[k]!=null && String(v[k])===String(V.id)) return true; } return false; } return String(v)===String(V.id); }

function renderPortal(){
  var mine=(PRODS||[]).filter(function(p){ return isMine(p.id) && !p.internal; });
  mine.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  var H='<div class="topbar"><img class="logo" src="'+LOGO+'" alt="Gharnish" onerror="this.style.display=\'none\'"><div class="vn">'+esc(V.name||'Vendor')+'</div><button onclick="logout()">Sign out</button></div>';
  H+='<div class="wrap"><div class="hd"><h1>Your stock</h1><p>Update the quantity you have ready, and add upcoming stock with an arriving date. Changes show to customers on the store.</p></div>';
  if(!mine.length){ H+='<div class="empty">No products are assigned to you yet.<br>Please contact Gharnish.</div></div>'; screen(H); return; }
  mine.forEach(function(p){
    var q=(INV.items && typeof INV.items[p.id]==='number')?INV.items[p.id]:'';
    var inc=(INV.incoming && INV.incoming[p.id])||null;
    var iq=(inc && inc.qty)?inc.qty:''; var idt=(inc && inc.date)?inc.date:'';
    var img=p.image?('<img class="thumb" src="'+esc(p.image)+'" loading="lazy" onerror="this.className=\'thumb ph\';this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'thumb ph\',textContent:\'\uD83E\uDE91\'}))">'):'<div class="thumb ph">\uD83E\uDE91</div>';
    H+='<div class="card"><div class="prow">'+img+'<div style="flex:1;min-width:0"><div class="pnm">'+esc(p.name||'')+'</div><div class="pmeta">'+esc(p.id)+(p.cat?(' \u00b7 '+esc(p.cat)):'')+'</div>'
      +(q!==''?('<span class="badge">'+q+' Pc in stock</span>'):'')
      +(iq!==''||idt?(' <span class="badge up">\uD83D\uDE9A '+(iq!==''?iq+' Pc':'')+(idt?(' \u00b7 '+esc(idt)):'')+'</span>'):'')
      +'</div></div>'
      +'<div class="fields"><div><label class="fl">Stock available (Pc)</label><input class="in" type="number" inputmode="numeric" min="0" id="q-'+esc(p.id)+'" value="'+q+'" placeholder="e.g. 30"><div class="hint">Blank = shown as \u201cIn Stock\u201d. 0 = out of stock.</div></div>'
      +'<div class="row2"><div><label class="fl">Upcoming stock (Pc)</label><input class="in" type="number" inputmode="numeric" min="0" id="iq-'+esc(p.id)+'" value="'+iq+'" placeholder="e.g. 50"></div>'
      +'<div><label class="fl">Arriving on</label><input class="in" type="date" id="id-'+esc(p.id)+'" value="'+esc(idt)+'"></div></div></div>'
      +'<button class="save" id="save-'+esc(p.id)+'" onclick="saveProd(\''+esc(String(p.id)).replace(/\\/g,"\\\\").replace(/'/g,"\\'")+'\')">Save</button>'
      +'</div>';
  });
  H+='</div>';
  screen(H);
}

function saveProd(pid){
  var qtyRaw=val('q-'+pid); var iqtyRaw=val('iq-'+pid); var idate=(val('id-'+pid)||'').trim();
  var qty=(qtyRaw===''?null:Math.max(0,parseInt(qtyRaw,10)||0));
  var iqty=(iqtyRaw===''?null:Math.max(0,parseInt(iqtyRaw,10)||0));
  var d=idate||null;
  var b=document.getElementById('save-'+pid); if(b){ b.disabled=true; b.textContent='Saving\u2026'; }
  supa.rpc('vendor_update_stock',{p_product_id:pid,p_qty:qty,p_incoming_qty:iqty,p_incoming_date:d}).then(function(r){
    if(b){ b.disabled=false; b.textContent='Save'; }
    if(r.error){ toast('Failed: '+(r.error.message||'error'),true); return; }
    if(qty===null) delete INV.items[pid]; else INV.items[pid]=qty;
    if((iqty===null||iqty<=0)&&!d) delete INV.incoming[pid]; else INV.incoming[pid]={qty:iqty||0,date:d||''};
    renderPortal();
    toast('Saved \u2713');
  },function(){ if(b){ b.disabled=false; b.textContent='Save'; } toast('Save failed',true); });
}

/* init: resume session or show login */
(function(){
  if(!supa){ renderLogin('Connection unavailable'); return; }
  supa.auth.getSession().then(function(r){
    if(r && r.data && r.data.session){ boot(); } else { renderLogin(); }
  },function(){ renderLogin(); });
})();
</script>
</body>
</html>
