<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#211b14">
<title>Gharnish Vendor Hub</title>
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F5F1EB;--c1:#FFFFFF;--c2:#EDE8DF;--c3:#E3DCCF;--ink:#1A1510;--ink2:#6B5C40;--ink3:#A89070;--g:#C8860A;--grn:#2E7D32;--rst:#C62828;--blue:#1A6BA8;--r1:10px;--r2:14px;--r3:20px;--rpill:999px;--shadow:0 2px 14px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button,input,select{font-family:inherit;font-size:15px}
.hidden{display:none!important}
#login{position:fixed;inset:0;background:linear-gradient(160deg,#211b14,#3a2e1f);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.login-card{background:var(--c1);border-radius:var(--r3);box-shadow:0 8px 40px rgba(0,0,0,.3);width:100%;max-width:380px;padding:30px 24px;text-align:center}
.login-card img{width:54px;height:54px;border-radius:14px;margin-bottom:10px}
.login-card h1{font-size:20px;font-weight:800;margin:0 0 2px}
.login-card .sub{color:var(--ink3);font-size:12.5px;margin:0 0 20px}
.in{width:100%;padding:13px 14px;border:1.5px solid var(--c3);border-radius:var(--r1);background:#fff;color:var(--ink);outline:none;margin-bottom:10px}
.in:focus{border-color:var(--g)}
.btn{width:100%;padding:14px;border:none;border-radius:var(--r1);background:var(--g);color:#fff;font-weight:700;cursor:pointer}
.btn:active{filter:brightness(.94)}
.btn.sec{background:var(--c2);color:var(--ink2)}
.err{color:var(--rst);font-size:12.5px;margin-top:8px;min-height:16px;font-weight:600}
#app{display:none;min-height:100vh;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(33,27,20,.98);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .t{font-size:16px;font-weight:800}.topbar .t b{color:#E09A18}
.vsel{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:var(--rpill);padding:7px 12px;font-weight:700;font-size:13px;max-width:52%}
.vsel option{color:#000}
.logout{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:var(--rpill);padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;border:1.5px solid var(--c3);background:#fff;border-radius:var(--r1);font-weight:700;color:var(--ink2);cursor:pointer;font-size:13.5px}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--c3);border-radius:var(--rpill);background:#fff;outline:none;margin-bottom:12px}
.card{background:var(--c1);border-radius:var(--r2);box-shadow:var(--shadow);padding:11px 13px;margin-bottom:9px;display:flex;gap:11px;align-items:center}
.card.urg{border-left:4px solid var(--rst)}
.card.soon{border-left:4px solid #D97706}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:contain;background:var(--c2);flex:none}
.nm{font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.25}
.meta{font-size:11px;color:var(--ink3);margin-top:2px}
.chip{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:var(--rpill);color:#fff;vertical-align:middle}
.qty{font-weight:800;font-size:15px;color:var(--g);white-space:nowrap;min-width:40px;text-align:right}
.stage{margin:0;width:118px;flex:none;padding:6px;border:1.5px solid var(--c3);border-radius:var(--r1);font-size:12px;font-weight:700}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:34px 16px}
.ds-row{display:flex;gap:11px;align-items:center;background:var(--c1);border-radius:var(--r2);box-shadow:var(--shadow);padding:11px 13px;margin-bottom:9px;flex-wrap:wrap}
.ds-toggle{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink2)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--c3);border-radius:999px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--grn)}
.switch input:checked+.slider:before{transform:translateX(18px)}
.ds-fields{display:flex;gap:8px;width:100%;margin-top:8px}
.ds-fields .fin{flex:1}
.ds-fields label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.dsin{width:100%;padding:9px 10px;border:1.5px solid var(--c3);border-radius:var(--r1);outline:none}
.clr-badge{font-size:9.5px;font-weight:800;color:var(--g);text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--rpill);font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}.toast.bad{background:var(--rst)}
.note{background:#FFF7E8;border:1px solid #F0DFB8;color:#8A5C07;font-size:12px;padding:10px 12px;border-radius:var(--r1);margin-bottom:12px;line-height:1.5}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <img src="/icons/icon-192.png" onerror="this.style.display='none'">
    <h1>Vendor Hub</h1>
    <div class="sub">Sign in to see your work list & manage dead stock.</div>
    <input class="in" id="l-email" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">
    <input class="in" id="l-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="l-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="l-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="t">Ghar<b>nish</b> · Vendor</div>
    <select class="vsel hidden" id="vsel" onchange="switchVendor(this.value)"></select>
    <button class="logout" onclick="doLogout()">Sign out</button>
  </div>
  <div class="wrap">
    <div id="one-vend" class="note hidden"></div>
    <div class="tabs">
      <button id="tab-work-btn" class="on" onclick="go('work')">🛠 Work list</button>
      <button id="tab-stock-btn" onclick="go('stock')">🏷 Dead stock</button>
    </div>
    <div id="tab-work">
      <div id="work-view"><div class="empty">Loading…</div></div>
    </div>
    <div id="tab-stock" class="hidden">
      <div class="note">Mark items you have sitting in stock (dead stock) with a clearance price — they show in the customer <b>Clearance</b> section instantly.</div>
      <input id="ds-search" class="search" placeholder="Search your products…" oninput="renderStock()">
      <div id="stock-view"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL='https://djedmaezxvuzmwjnooel.supabase.co';
var SUPABASE_KEY='sb_publishable_ZLUr4NQFTEN6qzVAYNL7CA_qocs1pQK';
var supa=null; try{ supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}
var _VENDS=[], _vid=null, _tab='work', _WORK=[], _STOCK=[];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m,bad){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show'+(bad?' bad':''); clearTimeout(window._tt); window._tt=setTimeout(function(){t.className='toast';},2300); }
function daysTo(d){ if(!d)return null; var t=new Date(d); if(isNaN(t))return null; var n=new Date(); n.setHours(0,0,0,0); t.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function urg(d){ var x=daysTo(d); if(x==null)return {lvl:0,label:'',col:''}; if(x<0)return {lvl:3,label:(-x)+'d overdue',col:'#C62828'}; if(x===0)return {lvl:3,label:'Due today',col:'#C62828'}; if(x<=3)return {lvl:2,label:'Due in '+x+'d',col:'#D97706'}; if(x<=7)return {lvl:1,label:'Due in '+x+'d',col:'#C8860A'}; return {lvl:0,label:'',col:''}; }

/* AUTH */
function doLogin(){
  var email=(document.getElementById('l-email').value||'').trim().toLowerCase();
  var pass=document.getElementById('l-pass').value||'';
  var e=document.getElementById('l-err');
  if(!email||!pass){ e.textContent='Enter your email and password.'; return; }
  if(!supa){ e.textContent='Connection unavailable — reload.'; return; }
  var b=document.getElementById('l-btn'); b.disabled=true; b.textContent='Signing in…';
  supa.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    b.disabled=false; b.textContent='Sign in';
    if(r.error){ e.textContent=r.error.message||'Wrong email or password'; return; }
    boot();
  },function(){ b.disabled=false; b.textContent='Sign in'; e.textContent='Sign in failed — try again'; });
}
function doLogout(){ if(supa) supa.auth.signOut(); document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex'; }

function boot(){
  supa.rpc('my_vendors').then(function(r){
    if(r.error){ document.getElementById('l-err').textContent='Could not load your vendors.'; return; }
    _VENDS=r.data||[];
    if(!_VENDS.length){ document.getElementById('l-err').textContent='This login isn’t linked to any vendor yet. Contact Gharnish.'; return; }
    _vid=_VENDS[0].id;
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    var vs=document.getElementById('vsel');
    if(_VENDS.length>1){ vs.classList.remove('hidden'); vs.innerHTML=_VENDS.map(function(v){return '<option value="'+v.id+'">'+esc(v.name)+'</option>';}).join(''); document.getElementById('one-vend').classList.add('hidden'); }
    else { vs.classList.add('hidden'); var ov=document.getElementById('one-vend'); ov.classList.remove('hidden'); ov.innerHTML='Signed in as <b>'+esc(_VENDS[0].name)+'</b>'; }
    loadWork(); loadStock();
  },function(){ document.getElementById('l-err').textContent='Could not load your vendors.'; });
}
function switchVendor(id){ _vid=parseInt(id,10); document.getElementById('work-view').innerHTML='<div class="empty">Loading…</div>'; document.getElementById('stock-view').innerHTML='<div class="empty">Loading…</div>'; loadWork(); loadStock(); }
function go(t){ _tab=t; document.getElementById('tab-work').classList.toggle('hidden',t!=='work'); document.getElementById('tab-stock').classList.toggle('hidden',t!=='stock'); document.getElementById('tab-work-btn').classList.toggle('on',t==='work'); document.getElementById('tab-stock-btn').classList.toggle('on',t==='stock'); window.scrollTo(0,0); }

/* WORK LIST */
function loadWork(){
  supa.rpc('vendor_confirmed_for',{p_vendor_id:_vid}).then(function(r){
    if(r.error){ document.getElementById('work-view').innerHTML='<div class="empty">Could not load: '+esc(r.error.message)+'</div>'; return; }
    _WORK=r.data||[]; renderWork();
  },function(){ document.getElementById('work-view').innerHTML='<div class="empty">Error loading work list.</div>'; });
}
function renderWork(){
  var el=document.getElementById('work-view'); if(!el)return;
  var list=_WORK.slice().sort(function(a,b){ var ua=urg(a.delivery_date).lvl,ub=urg(b.delivery_date).lvl; if(ua!==ub)return ub-ua; var da=a.delivery_date?new Date(a.delivery_date).getTime():Infinity,db=b.delivery_date?new Date(b.delivery_date).getTime():Infinity; return da-db; });
  if(!list.length){ el.innerHTML='<div class="empty">Nothing to make right now. New confirmed orders will appear here.</div>'; return; }
  var STAGES=['Assigned','Processing','Ready'];
  el.innerHTML=list.map(function(it){
    var u=urg(it.delivery_date);
    var cls=u.lvl>=3?' urg':(u.lvl===2?' soon':'');
    var stg=it.stage||'Assigned'; if(STAGES.indexOf(stg)<0)stg='Assigned';
    return '<div class="card'+cls+'">'+
      (it.image?'<img class="thumb" src="'+esc(it.image)+'">':'<span class="thumb"></span>')+
      '<div style="flex:1;min-width:0"><div class="nm">'+esc(it.name)+'</div>'+
      '<div class="meta">'+(it.title?('Order '+esc(it.title)):'Order')+(u.lvl?(' · <b style="color:'+u.col+'">'+esc(u.label)+'</b>'):(it.delivery_date?(' · deliver '+esc(fmtD(it.delivery_date))):''))+'</div></div>'+
      '<span class="qty">×'+(+it.qty||0)+'</span>'+
      '<select class="stage" onchange="setStage(\''+esc(String(it.order_id))+'\',\''+esc(String(it.pid))+'\',this.value)">'+STAGES.map(function(s){return '<option'+(s===stg?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
      '</div>';
  }).join('');
}
function fmtD(d){ try{ return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }catch(e){ return d; } }
function setStage(orderId,pid,stage){
  supa.rpc('vendor_set_stage_for',{p_vendor_id:_vid,p_order_id:String(orderId),p_pid:String(pid),p_stage:stage}).then(function(r){
    if(r.error){ toast('Failed: '+r.error.message,true); return; }
    var w=_WORK.find(function(x){return String(x.order_id)===String(orderId)&&String(x.pid)===String(pid);}); if(w)w.stage=stage;
    toast('Marked '+stage);
  },function(){ toast('Update failed',true); });
}

/* DEAD STOCK */
function loadStock(){
  supa.rpc('vendor_assigned_for',{p_vendor_id:_vid}).then(function(r){
    if(r.error){ document.getElementById('stock-view').innerHTML='<div class="empty">Could not load: '+esc(r.error.message)+'</div>'; return; }
    _STOCK=r.data||[]; renderStock();
  },function(){ document.getElementById('stock-view').innerHTML='<div class="empty">Error loading products.</div>'; });
}
function renderStock(){
  var el=document.getElementById('stock-view'); if(!el)return;
  var q=(document.getElementById('ds-search').value||'').toLowerCase().trim();
  var list=_STOCK.filter(function(p){ return !q||(p.name||'').toLowerCase().indexOf(q)>-1; });
  if(!list.length){ el.innerHTML='<div class="empty">'+(q?'No products match.':'No products assigned to you yet.')+'</div>'; return; }
  el.innerHTML=list.map(function(p){
    var on=!!p.clr_active;
    return '<div class="ds-row" id="ds-'+esc(String(p.id))+'">'+
      (p.image?'<img class="thumb" src="'+esc(p.image)+'">':'<span class="thumb"></span>')+
      '<div style="flex:1;min-width:0"><div class="nm">'+esc(p.name)+'</div><div class="meta">MRP ₹'+(+p.price||0).toLocaleString('en-IN')+(on?' · <span class="clr-badge">On clearance</span>':'')+'</div></div>'+
      '<label class="ds-toggle">Dead stock<span class="switch"><input type="checkbox"'+(on?' checked':'')+' onchange="toggleClr('+p.id+',this.checked)"><span class="slider"></span></span></label>'+
      '<div class="ds-fields'+(on?'':' hidden')+'" id="dsf-'+esc(String(p.id))+'"><div class="fin"><label>Clearance price ₹</label><input class="dsin" type="number" id="clrp-'+esc(String(p.id))+'" value="'+(p.clr_offer||'')+'" placeholder="0"></div><div class="fin"><label>Qty available</label><input class="dsin" type="number" id="clrq-'+esc(String(p.id))+'" value="'+(p.clr_qty||'')+'" placeholder="0"></div><div class="fin" style="display:flex;align-items:flex-end"><button class="btn" style="padding:9px" onclick="saveClr('+p.id+')">Save</button></div></div>'+
      '</div>';
  }).join('');
}
function toggleClr(pid,on){
  var f=document.getElementById('dsf-'+pid); if(f)f.classList.toggle('hidden',!on);
  if(!on){ // turning off
    supa.rpc('vendor_set_clearance_for',{p_vendor_id:_vid,p_product_id:String(pid),p_active:false,p_price:0,p_qty:0}).then(function(r){
      if(r.error){ toast('Failed: '+r.error.message,true); return; }
      var s=_STOCK.find(function(x){return String(x.id)===String(pid);}); if(s){s.clr_active=false;}
      toast('Removed from clearance');
    },function(){ toast('Failed',true); });
  }
}
function saveClr(pid){
  var price=parseInt((document.getElementById('clrp-'+pid)||{}).value,10)||0;
  var qty=parseInt((document.getElementById('clrq-'+pid)||{}).value,10)||0;
  if(price<=0){ toast('Enter a clearance price',true); return; }
  supa.rpc('vendor_set_clearance_for',{p_vendor_id:_vid,p_product_id:String(pid),p_active:true,p_price:price,p_qty:qty}).then(function(r){
    if(r.error){ toast('Failed: '+r.error.message,true); return; }
    var s=_STOCK.find(function(x){return String(x.id)===String(pid);}); if(s){s.clr_active=true;s.clr_offer=price;s.clr_qty=qty;}
    toast('Saved to clearance ✓');
  },function(){ toast('Failed',true); });
}

/* BOOT */
document.getElementById('l-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('l-email').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('l-pass').focus(); });
(function(){ if(supa){ supa.auth.getSession().then(function(s){ if(s.data.session&&s.data.session.user){ boot(); } }); } })();
</script>
</body>
</html>
